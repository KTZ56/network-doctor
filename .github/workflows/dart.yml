name: Network Doctor CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: Build Network Doctor
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.8"
          cache: true

      - name: Check Flutter
        run: flutter --version

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze project
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build Windows application
        run: flutter build windows --release

      - name: Verify Windows build
        shell: powershell
        run: |
          $app = "build\windows\x64\runner\Release\network_doctor.exe"

          if (-not (Test-Path $app)) {
              Write-Error "Network Doctor executable was not found."
              exit 1
          }

          Write-Host "Windows build verified:"
          Write-Host $app

      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: powershell
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"

          if (-not (Test-Path $iscc)) {
              Write-Error "Inno Setup compiler was not found."
              exit 1
          }

          & $iscc "installer\NetworkDoctor.iss"

      - name: Verify installer
        shell: powershell
        run: |
          $installer = "installer\output\Network Doctor Setup.exe"

          if (-not (Test-Path $installer)) {
              Write-Error "Network Doctor installer was not created."
              exit 1
          }

          Write-Host "Installer created successfully:"
          Write-Host $installer

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: network-doctor-installer
          path: installer/output/Network Doctor Setup.exe

      - name: Create ZIP package
        shell: powershell
        run: |
          Compress-Archive `
            -Path "build\windows\x64\runner\Release\*" `
            -DestinationPath "network-doctor-windows.zip" `
            -Force

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: network-doctor-windows-zip
          path: network-doctor-windows.zip